backend:
  name: github
  repo: lucassbalbino/Empreendimento-Santos
  branch: main
  base_url: https://sveltia-cms-auth.lucascharlesbalbino.workers.dev

# Permite editar localmente na demonstração, sem GitHub.
# Rodar:  npm run cms-proxy   (em outro terminal, junto com  npm run dev)
local_backend: true

media_folder: "public/images"
public_folder: "/images"

# Idioma do painel
locale: pt

collections:
  # ---------------------------------------------------------------- INÍCIO
  - name: home
    label: "Página Início"
    delete: false
    files:
      - name: home
        label: "Conteúdo da Início"
        file: "src/data/home.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Quem Somos"
            name: quemSomos
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - label: "Dados em destaque"
                name: meta
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                hint: "A grelha de dados à esquerda do parágrafo (ex.: 20 anos — de experiência no mercado)."
                fields:
                  - { label: "Valor", name: value, widget: string }
                  - { label: "Descrição", name: label, widget: string }
              - { label: "Parágrafo", name: paragrafo, widget: text }
              - { label: "Texto do botão", name: botao, widget: string }
              - { label: "Imagem", name: imagem, widget: image, required: false, hint: "Horizontal 16:9. Se vazio, mostra o marcador de imagem." }
          - label: "O Que Fazemos (pilares e números)"
            name: oQueFazemos
            widget: object
            fields:
              - { label: "Título (pilares)", name: title, widget: string, hint: "Separe as palavras com travessão ( — ): cada uma vira um item numerado. Ex.: Qualidade — Conforto — Sustentabilidade." }
              - { label: "Texto de introdução", name: lead, widget: text }
              - label: "Pilares"
                name: pilares
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Texto", name: texto, widget: text }
              - { label: "Título (números)", name: statsTitle, widget: string }
              - { label: "Texto (números)", name: statsLead, widget: text }
              - label: "Números / destaques"
                name: stats
                widget: list
                summary: "{{fields.label}}"
                hint: "Cada item é um contador numérico (preencha 'Número') OU uma palavra-destaque (preencha 'Texto'). Não preencha os dois."
                fields:
                  - { label: "Número (contador)", name: target, widget: number, value_type: int, required: false, hint: "Contador animado, ex.: 20. Deixe vazio se usar 'Texto'." }
                  - { label: "Prefixo", name: prefix, widget: string, required: false }
                  - { label: "Sufixo", name: suffix, widget: string, required: false }
                  - { label: "Texto (palavra-destaque)", name: value, widget: string, required: false, hint: "Alternativa ao número, ex.: Arquitetura. Deixe vazio se usar 'Número'." }
                  - { label: "Rótulo", name: label, widget: string }
          - label: "Portfólio (destaques)"
            name: portfolio
            widget: object
            fields:
              - { label: "Título", name: title, widget: string, hint: "Aparece como marca d'água grande no fundo do slider." }
              - { label: "Texto do botão", name: botao, widget: string }
          - label: "Track Record"
            name: trackRecord
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: string }
              - { label: "Texto do botão", name: botao, widget: string }
          - label: "Perguntas frequentes"
            name: faq
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: text }
              - label: "Perguntas"
                name: items
                widget: list
                summary: "{{fields.p}}"
                fields:
                  - { label: "Pergunta", name: p, widget: string }
                  - { label: "Resposta", name: r, widget: text }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------- EMPREENDIMENTOS
  # Coleção de PASTA: um ficheiro por projeto em src/content/empreendimentos/.
  # As páginas Início, Portfólio e Histórico derivam daqui pela FASE (campo
  # "grupo") — ver src/utils/projetos.js. O ciclo de vida faz-se todo aqui:
  #   · Novo projeto futuro  → botão "Novo Empreendimento" (já vem em "futuro");
  #   · Futuro → desenvolvimento, desenvolvimento → histórico → mudar só a Fase.
  # Estado da obra, situação comercial no histórico, frase de entrega e linha
  # "Estado" da ficha acompanham a fase sozinhos, enquanto ficarem vazios.
  - name: empreendimentos
    label: "Empreendimentos"
    label_singular: "Empreendimento"
    description: "Mudar um projeto de fase = alterar só o campo «Fase». Estado, entrega e ficha acompanham automaticamente."
    folder: "src/content/empreendimentos"
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: nome
    # O nome do ficheiro é o endereço (/empreendimentos/<slug>) e fica fixo
    # depois de criado — é o que o Google indexa e o que liga as traduções.
    slug: "{{slug}}"
    summary: "{{nome}} · {{ano}}"
    sortable_fields: [ano, nome]
    view_filters:
      - { label: "Projetos futuros", field: grupo, pattern: "^futuro$" }
      - { label: "Em desenvolvimento", field: grupo, pattern: "^desenvolvimento$" }
      - { label: "Histórico (concluídos)", field: grupo, pattern: "^concluido$" }
    view_groups:
      - { label: "Fase", field: grupo }
    fields:
      - { label: "Nome", name: nome, widget: string, hint: "Ao criar, define também o endereço da página (não muda depois)." }
      - label: "Fase"
        name: grupo
        widget: select
        default: futuro
        hint: "Onde o projeto aparece no site. Para avançar um projeto basta mudar esta opção."
        options:
          - { label: "Projeto futuro (Portfólio)", value: futuro }
          - { label: "Em desenvolvimento (Portfólio)", value: desenvolvimento }
          - { label: "Concluído / vendido (Histórico)", value: concluido }
      - { label: "Ano", name: ano, widget: number, value_type: int, hint: "Ano de conclusão ou de previsão. Ordena as listagens (mais recentes primeiro)." }
      - { label: "Localização", name: localizacao, widget: string, hint: "Ex.: Sta. Iria de Azóia, Loures" }
      - { label: "Concelho", name: concelho, widget: string, required: false }
      - { label: "Tipologia", name: tipologia, widget: string, hint: "Ex.: T2 e T3" }
      - { label: "Unidades", name: unidades, widget: string, required: false, hint: "Ex.: 14 apartamentos" }
      - { label: "Resumo", name: resumo, widget: text, hint: "Texto principal da página do empreendimento." }
      - { label: "Imagem principal", name: imagem, widget: image, required: false, hint: "Se vazio, mostra um marcador de imagem." }
      - { label: "A imagem retrata mesmo este empreendimento?", name: imagemReal, widget: boolean, default: false, hint: "Desligado = imagem provisória (mostra o selo «Imagem provisória»)." }
      - label: "Galeria"
        name: galeria
        widget: list
        required: false
        field: { label: "Imagem", name: imagem, widget: image }
      - label: "Ficha técnica"
        name: factos
        widget: list
        required: false
        summary: "{{fields.rotulo}}: {{fields.valor}}"
        hint: "A linha «Estado» é acrescentada automaticamente no fim — não a repita aqui."
        default:
          - { rotulo: "Localização", valor: "" }
          - { rotulo: "Ano", valor: "" }
          - { rotulo: "Unidades", valor: "" }
          - { rotulo: "Tipologia", valor: "" }
        fields:
          - { label: "Rótulo", name: rotulo, widget: string }
          - { label: "Valor", name: valor, widget: string }
      - label: "Proximidades"
        name: proximidades
        widget: list
        required: false
        summary: "{{fields.local}} — {{fields.minutos}} min"
        hint: "O que há à volta e a quantos minutos (supermercados, escolas, transportes). Aparece em linhas ao lado do mapa, na secção Localização, pela ordem desta lista."
        fields:
          - { label: "Local", name: local, widget: string, hint: "Ex.: Estação de Santa Iria" }
          - { label: "Minutos", name: minutos, widget: number, value_type: int, min: 0 }
      - { label: "Mapa de proximidades", name: mapaProximidades, widget: image, required: false, hint: "Mapa com os pontos de interesse à volta. É o mapa mostrado na secção Localização." }
      - { label: "Mapa de localização", name: mapa, widget: image, required: false, hint: "Usado só quando não há mapa de proximidades. Sem nenhum dos dois, mostra um marcador de mapa." }
      - { label: "Destacar", name: destaque, widget: boolean, default: false, hint: "Aparece primeiro entre os projetos do mesmo ano." }
      # Exceções — vazios, seguem a fase (é o que torna a mudança de fase automática).
      - label: "Estado da obra (exceção)"
        name: estado
        widget: select
        required: false
        hint: "Deixe vazio: segue a fase (Em projeto / Em construção / Concluído). Preencha só em exceções, ex.: vendido ainda em construção."
        options: ["Em projeto", "Em construção", "Concluído"]
      - { label: "Situação comercial", name: comercial, widget: string, required: false, hint: "Ex.: Em comercialização, Arrendamento. No Histórico é sempre «Vendido»." }
      - { label: "Frase de entrega (exceção)", name: entrega, widget: string, required: false, hint: "Deixe vazio: gera-se do estado e do ano (Previsão 2029 / Em construção · 2029 / Concluído em 2029)." }

  # ---------------------------------------------- PÁGINA DE EMPREENDIMENTO
  - name: empreendimento
    label: "Página de empreendimento (textos comuns)"
    delete: false
    files:
      - name: empreendimento
        label: "Textos comuns das fichas"
        file: "src/data/empreendimento.json"
        fields:
          - { label: "Nota interna", name: _nota, widget: hidden }
          - label: "Parágrafo institucional"
            name: paragrafo
            widget: object
            hint: "{nome} é substituído pelo nome do empreendimento."
            fields:
              - { label: "Obra concluída", name: concluido, widget: text }
              - { label: "Em projeto / em construção", name: outro, widget: text }
          - label: "Texto do botão"
            name: botao
            widget: object
            fields:
              - { label: "Em projeto", name: emProjeto, widget: string }
              - { label: "Em construção", name: emConstrucao, widget: string }
              - { label: "Concluído", name: concluido, widget: string }
          - { label: "Título da ficha técnica", name: fichaTitulo, widget: string }
          - { label: "Título da galeria", name: imagensTitulo, widget: string }
          - { label: "Legenda do mapa", name: mapaLegenda, widget: string }
          - { label: "Unidade dos tempos (proximidades)", name: minutos, widget: string, hint: "Texto a seguir ao número em cada linha das proximidades, ex.: min" }
          - { label: "Título dos relacionados", name: continuarTitulo, widget: string }
          - label: "Contacto"
            name: contacto
            widget: object
            hint: "{nome} é substituído pelo nome do empreendimento."
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------------- PORTFÓLIO
  - name: portfolio
    label: "Página Portfólio"
    delete: false
    files:
      - name: portfolio
        label: "Conteúdo do Portfólio"
        file: "src/data/portfolio.json"
        fields:
          - { label: "Nota interna", name: _nota, widget: hidden }
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Projetos em desenvolvimento"
            name: emDesenvolvimento
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: string }
          - label: "Projetos futuros"
            name: futuros
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: string }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------------- SOBRE NÓS
  - name: sobre
    label: "Página Sobre Nós"
    delete: false
    files:
      - name: sobre
        label: "Conteúdo do Sobre Nós"
        file: "src/data/sobre.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Quem Somos"
            name: quemSomos
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Destaque", name: lead, widget: text }
              - { label: "Parágrafo", name: paragrafo, widget: text }
              - { label: "Imagem", name: imagem, widget: image, required: false, hint: "Vertical 4:5. Se vazio, mostra o marcador de imagem." }
          - label: "20 anos de solidez (imagens e números)"
            name: oQueFazemos
            widget: object
            hint: "Os números desta secção são os mesmos da Página Início › O Que Fazemos › Números."
            fields:
              - { label: "Título", name: title, widget: text }
              - label: "Imagens"
                name: imagens
                widget: object
                fields:
                  - label: "Coluna A"
                    name: colunaA
                    widget: list
                    field: { label: "Imagem", name: imagem, widget: image }
                  - label: "Coluna B"
                    name: colunaB
                    widget: list
                    field: { label: "Imagem", name: imagem, widget: image }
          - label: "O que nos move (serviços)"
            name: servicos
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - label: "Serviços"
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Texto", name: texto, widget: text }
                  - { label: "Imagem", name: imagem, widget: image, required: false, hint: "Horizontal 5:4." }
                  - { label: "Texto do botão", name: botao, widget: string, required: false, hint: "O botão só aparece com texto E destino preenchidos." }
                  - { label: "Destino do botão", name: link, widget: string, required: false, hint: "Página do site (ex.: /portfolio, /contactos) ou endereço completo." }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------------- HISTÓRICO
  - name: historico
    label: "Página Histórico"
    delete: false
    files:
      - name: historico
        label: "Conteúdo do Histórico"
        file: "src/data/historico.json"
        fields:
          - { label: "Nota interna", name: _nota, widget: hidden }
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Cabeçalho da secção (concluídos)"
            name: concluidos
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: string }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ---------------------------------------------------------------- EQUIPA
  - name: equipa
    label: "Página Equipa"
    delete: false
    files:
      - name: equipa
        label: "Conteúdo da Equipa"
        file: "src/data/equipa.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Direção"
            name: direcao
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - label: "Membros"
                name: members
                widget: list
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { label: "Nome", name: name, widget: string }
                  - { label: "Função", name: role, widget: string }
          - label: "Equipa (por área)"
            name: equipa
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - label: "Áreas"
                name: grupos
                widget: list
                summary: "{{fields.area}}"
                hint: "Cada área é um bloco do organograma, com as pessoas que a compõem."
                fields:
                  - { label: "Área", name: area, widget: string, hint: "Ex.: Engenharia e Obra" }
                  - label: "Membros"
                    name: members
                    widget: list
                    summary: "{{fields.name}} — {{fields.role}}"
                    fields:
                      - { label: "Nome", name: name, widget: string }
                      - { label: "Função", name: role, widget: string }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------------- CONTACTOS
  - name: contactos
    label: "Página Contactos"
    delete: false
    files:
      - name: contactos
        label: "Conteúdo dos Contactos"
        file: "src/data/contactos.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Imagem de fundo", name: imagem, widget: image, required: false }
          - label: "Contacto"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "E-mail", name: email, widget: string }
              - label: "Telefones"
                name: telefones
                widget: list
                summary: "{{fields.label}} — {{fields.numero}}"
                fields:
                  - { label: "Descrição", name: label, widget: string, hint: "Ex.: Departamento Comercial" }
                  - { label: "Número", name: numero, widget: string, hint: "Ex.: 910 043 904" }
          - label: "Onde Estamos"
            name: onde
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Morada", name: morada, widget: text }
              - { label: "Legenda do mapa", name: mapaLabel, widget: string }

  # ------------------------------------------------- GERAL (header/footer)
  - name: site
    label: "Geral (rodapé)"
    delete: false
    files:
      - name: site
        label: "Rodapé e redes sociais"
        file: "src/data/site.json"
        fields:
          - label: "Rodapé"
            name: footer
            widget: object
            fields:
              - { label: "Texto", name: blurb, widget: text }
              - { label: "Morada", name: morada, widget: text }
              - { label: "E-mail", name: email, widget: string }
              - label: "Telefones"
                name: telefones
                widget: list
                summary: "{{fields.label}} — {{fields.numero}}"
                fields:
                  - { label: "Descrição", name: label, widget: string, hint: "Ex.: Departamento Comercial" }
                  - { label: "Número", name: numero, widget: string, hint: "Ex.: 910 043 904" }
              - { label: "Copyright", name: copyright, widget: string }
              - { label: "Assinatura", name: assinatura, widget: string }
          - label: "Redes sociais"
            name: redes
            widget: object
            hint: "Endereço completo (https://…). Cada ícone só aparece no rodapé quando o endereço está preenchido."
            fields:
              - { label: "Instagram", name: instagram, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }
              - { label: "LinkedIn", name: linkedin, widget: string, required: false }

  # ------------------------------------------------------ BLOG (textos fixos)
  - name: blog-pagina
    label: "Página Blog (textos fixos)"
    delete: false
    files:
      - name: blog-pagina
        label: "Textos da listagem e dos artigos"
        file: "src/data/blog.json"
        fields:
          - { label: "Nota interna", name: _nota, widget: hidden }
          - label: "Listagem"
            name: listagem
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Subtítulo", name: lead, widget: text }
              - { label: "Texto do link de cada artigo", name: botao, widget: string }
          - label: "Contacto (listagem)"
            name: contacto
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Contacto (fim de cada artigo)"
            name: contactoArtigo
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: texto, widget: text }

  # ------------------------------------------------------------------- SEO
  # O que o Google mostra. Os campos técnicos (domínio, idioma, indexação)
  # ficam ocultos — mudá-los parte canonical, sitemap e JSON-LD. Ver docs/SEO.md.
  - name: seo
    label: "SEO (Google e partilhas)"
    delete: false
    files:
      - name: seo
        label: "Títulos, descrições e dados da empresa"
        file: "src/data/seo.json"
        fields:
          - { label: "Nota interna", name: _leia, widget: hidden }
          - { label: "Domínio", name: dominio, widget: hidden }
          - { label: "Indexável", name: indexavel, widget: hidden }
          - { label: "Idioma", name: idioma, widget: hidden }
          - { label: "Locale Open Graph", name: ogLocale, widget: hidden }
          - { label: "Marca", name: marca, widget: string, hint: "Acrescentada aos títulos das páginas (ex.: «| AM Santos»)." }
          - { label: "Imagem de partilha por omissão", name: imagemPadrao, widget: image, hint: "Usada nas redes sociais quando a página não tem imagem própria. Horizontal, 1200×630." }
          - label: "Páginas"
            name: paginas
            widget: object
            hint: "Título: até ~60 caracteres. Descrição: 120 a 160 caracteres — é o texto por baixo do link no Google."
            fields:
              - { label: "Início", name: "/", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Sobre Nós", name: "/sobre-nos", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Portfólio", name: "/portfolio", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Histórico", name: "/historico", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Equipa", name: "/equipa", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Contactos", name: "/contactos", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Blog", name: "/blog", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Imagem de partilha", name: imagem, widget: image, required: false }] }
              - { label: "Política de Cookies", name: "/politica-de-cookies", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }] }
              - { label: "Política de Privacidade", name: "/politica-de-privacidade", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }] }
              - { label: "Página não encontrada (404)", name: "/404", widget: object, fields: [{ label: "Título", name: title, widget: string }, { label: "Descrição", name: description, widget: text }, { label: "Fora do Google", name: noindex, widget: hidden }] }
          - label: "Empresa"
            name: organizacao
            widget: object
            fields:
              - { label: "Nome legal", name: nomeLegal, widget: string }
              - { label: "Fundador", name: fundador, widget: string }
              - { label: "Descrição", name: descricao, widget: text }
              - { label: "Slogan", name: slogan, widget: string }
              - { label: "Logótipo", name: logo, widget: image }
              - { label: "Zonas onde atua", name: areasServidas, widget: list }
              - { label: "Especialidades", name: especialidades, widget: list }
              - { label: "Perfis oficiais (redes sociais, diretórios)", name: sameAs, widget: list, required: false, hint: "Endereços completos. Ajudam o Google a ligar o site à empresa." }
          - label: "Morada e contacto (NAP)"
            name: nap
            widget: object
            hint: "Só entra no Google quando «Dados verificados» estiver ligado. Publicar dados errados contamina o Google Business Profile."
            fields:
              - { label: "Nota interna", name: _leia, widget: hidden }
              - { label: "Dados verificados", name: verificado, widget: boolean, default: false }
              - { label: "Morada", name: morada, widget: string }
              - { label: "Código postal", name: codigoPostal, widget: string }
              - { label: "Localidade", name: localidade, widget: string }
              - { label: "Região", name: regiao, widget: string }
              - { label: "País (código)", name: pais, widget: string, hint: "Ex.: PT" }
              - { label: "Telefone", name: telefone, widget: string, hint: "Formato internacional, ex.: +351 910 043 904" }
              - { label: "E-mail", name: email, widget: string }
              - { label: "Latitude", name: latitude, widget: number, value_type: float, required: false }
              - { label: "Longitude", name: longitude, widget: number, value_type: float, required: false }
              - { label: "Horário", name: horario, widget: string, hint: "Formato schema.org, ex.: Mo-Fr 09:00-18:00" }
          - label: "Estatísticas"
            name: analytics
            widget: object
            fields:
              - { label: "Nota interna", name: _leia, widget: hidden }
              - { label: "Token do Cloudflare Web Analytics", name: cloudflareToken, widget: string, required: false, hint: "Enquanto estiver vazio, o script de estatísticas não é carregado." }

  # --------------------------------------------------------------- COOKIES
  # O inventário é um documento legal: tem de descrever exatamente o que o site
  # guarda no equipamento de quem o visita. Fica editável aqui para que
  # acrescentar um serviço não obrigue a mexer em código — mas atenção, editar
  # esta lista NÃO liga nem desliga nada: descreve. Quem acrescenta um serviço
  # tem de fazer as duas coisas (marcar o script com data-ams-consent E
  # acrescentar a linha aqui). Ver docs/COOKIES.md.
  - name: cookies
    label: "Cookies (inventário)"
    delete: false
    files:
      - name: cookies
        label: "Categorias e inventário"
        file: "src/data/cookies.json"
        fields:
          - { label: "Nota interna", name: _leia, widget: hidden }
          - label: "Versão do consentimento"
            name: versao
            widget: number
            value_type: int
            hint: "AVISO: subir este número invalida o consentimento de TODOS os visitantes e o aviso volta a aparecer a toda a gente. Só o faça quando mudarem as categorias ou os serviços usados — que é precisamente quando a lei obriga a voltar a perguntar."
          - label: "Nome do cookie de registo"
            name: cookieNome
            widget: string
            hint: "AVISO: mudar isto faz o site perder as escolhas já guardadas por todos os visitantes. Não mexer sem razão técnica."
          - label: "Validade do consentimento (dias)"
            name: validadeDias
            widget: number
            value_type: int
            hint: "Ao fim deste prazo voltamos a perguntar. 180 dias (6 meses) é o intervalo recomendado pelas autoridades europeias. Não é aconselhável ultrapassar os 12 meses."
          - label: "Categorias"
            name: categorias
            widget: list
            summary: "{{fields.nome}}"
            hint: "As categorias que aparecem no painel de definições. Acrescentar ou remover categorias exige alteração no código — aqui edite sobretudo os nomes e as descrições."
            fields:
              - { label: "Identificador", name: id, widget: string, hint: "AVISO: é este texto que liga a categoria aos scripts (data-ams-consent). Mudá-lo parte essa ligação em silêncio — o script deixa de arrancar, sem erro nenhum. Não mexer." }
              - { label: "Nome visível", name: nome, widget: string }
              - { label: "Sempre ativa", name: obrigatoria, widget: boolean, default: false, hint: "Só para o que é estritamente necessário ao funcionamento do site. Marcar isto numa categoria que não seja isenta por lei retira ao visitante uma escolha que ele tem direito a fazer." }
              - { label: "Descrição", name: descricao, widget: text, hint: "Em linguagem simples, o que esta categoria faz e o que acontece se for recusada. É este texto que o visitante lê no painel." }
          - label: "Inventário"
            name: inventario
            widget: list
            summary: "{{fields.nome}} ({{fields.categoria}})"
            hint: "Lista integral do que o site guarda ou lê no equipamento do visitante. Esta lista é impressa tal e qual na Política de Cookies — o que não estiver aqui não pode ser usado."
            fields:
              - { label: "Nome", name: nome, widget: string, hint: "O nome técnico do cookie, ou o nome do serviço (ex.: ams-consent, Cloudflare Web Analytics)." }
              - label: "Categoria"
                name: categoria
                widget: select
                options: ["necessarios", "estatisticas", "marketing"]
                hint: "Tem de coincidir com o identificador de uma das categorias acima."
              - { label: "Tipo", name: tipo, widget: string, hint: "Ex.: Cookie, localStorage, sessionStorage, Script (sem cookies)." }
              - { label: "Fornecedor", name: fornecedor, widget: string, hint: "Quem o coloca. Primeira parte (o próprio site) ou o nome da empresa terceira." }
              - { label: "Duração", name: duracao, widget: string, hint: "Ex.: 6 meses, Fecha com o separador, Até ser apagado pelo visitante." }
              - { label: "Finalidade", name: finalidade, widget: text, hint: "Para que serve, em linguagem que o visitante perceba. 'Análise' não chega — diga o que é medido." }

  # ------------------------------------------------------------------ BLOG
  # Coleção de PASTA (e não de ficheiros fixos como as restantes): cada artigo
  # é um ficheiro Markdown novo em src/content/blog/. O nome do ficheiro vira o
  # endereço do artigo — e o endereço nunca deve mudar depois de publicado,
  # porque é ele que o Google indexa e que as pessoas partilham.
  - name: blog
    label: "Blog"
    label_singular: "Artigo"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{titulo}} — {{data | date('DD/MM/YYYY')}}"
    sortable_fields: [data, titulo]
    view_filters:
      - { label: "Rascunhos", field: rascunho, pattern: true }
    fields:
      - { label: "Título", name: titulo, widget: string, hint: "O título editorial, mostrado na página." }
      - { label: "Título para o Google", name: seoTitulo, widget: string, required: false, hint: "Opcional. Até ~60 caracteres, incluindo ' | AM Santos'. Se ficar vazio, usa-se o título editorial." }
      - { label: "Resumo", name: resumo, widget: text, hint: "120 a 160 caracteres. É o texto que aparece por baixo do link nos resultados do Google — escreva-o para convencer alguém a clicar." }
      - { label: "Data de publicação", name: data, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
      - { label: "Data de atualização", name: atualizado, widget: datetime, date_format: "DD/MM/YYYY", time_format: false, picker_utc: true, required: false, hint: "Preencher quando reescrever um artigo antigo. O Google valoriza conteúdo atualizado." }
      - { label: "Autor", name: autor, widget: string, default: "AM Santos" }
      - { label: "Imagem de destaque", name: imagem, widget: image, required: false, hint: "Horizontal. Aparece na lista, no topo do artigo e nas partilhas em redes sociais." }
      - { label: "Etiquetas", name: tags, widget: list, required: false, default: [], hint: "Ex.: Loures, eficiência energética, guia." }
      - { label: "Rascunho", name: rascunho, widget: boolean, default: true, hint: "Enquanto estiver ligado, o artigo NÃO é publicado nem entra no sitemap." }
      - { label: "Artigo", name: body, widget: markdown, hint: "Use cabeçalhos (##) para dividir o texto. Ligue para páginas do site — /portfolio/, /historico/, /contactos/ — sempre que fizer sentido." }
